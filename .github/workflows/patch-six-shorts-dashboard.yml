name: Patch six Shorts dashboard

on:
  push:
    paths:
      - "automation/page-patch.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard copy and six-Shorts logic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/page.tsx")
          text = path.read_text()
          replacements = {
              'const todayComplete = publishedToday.length >= 3;': 'const todayComplete = publishedToday.length >= 6;',
              'const perShortTarget = shortsGrowthGoal.requiredViewsPerDay / 3;': 'const perShortTarget = shortsGrowthGoal.requiredViewsPerDay / 6;',
              '"Üç video üç ayrı amaç taşıyor: biri izlenme, biri abone, biri beğeni. Saatler bu haftaki kanal sonucuna göre hesaplandı."': '"Altı video üç amacı dengeli dağıtıyor: iki izlenme, iki abone, iki beğeni odağı. Saatler kanalındaki gerçek yayın sonuçlarına göre puanlanıyor."',
              '`${todayShorts.length || 3} Shorts${todayLong ? " + 1 uzun" : ""}`': '`${todayShorts.length || 6} Shorts${todayLong ? " + 1 uzun" : ""}`',
              '30 GÜNDE 90 SHORTS + 4 UZUN VİDEO': '30 GÜNDE 180 SHORTS',
              'Bu yüzden tek bir konuya yüklenmek yerine, 3 ayrı kancayı her gün kontrollü test edeceğiz.': 'Bu yüzden aynı konuyu tekrarlamak yerine, 6 ayrı içeriği kanalındaki gerçek sonuçlarla kontrollü test edeceğiz.',
              'Üç farklı soru kalıbını test et.': 'Altı farklı içerikte güçlü soru kalıplarını test et.',
          }
          missing = []
          for old, new in replacements.items():
              if old not in text:
                  missing.append(old)
              text = text.replace(old, new)
          if missing:
              raise SystemExit("Beklenen metinler bulunamadı: " + " | ".join(missing))
          path.write_text(text)
          PY
      - name: Commit dashboard patch
        run: |
          git config user.name "youtube-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Paneli 6 Shorts canlı plan mantığına düzelt"
          git push
