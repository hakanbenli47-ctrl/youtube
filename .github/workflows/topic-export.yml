name: Topic Export
on:
  push:
    paths:
      - '.github/workflows/topic-export.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch connected channel titles
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 'https://youtube-l0wuxqzdl-hakans-projects-67873302.vercel.app/api/dashboard' \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); s=d["state"]; print("CHANNEL\t"+str(s["channel"].get("title",""))+"\t"+str(s["channel"].get("handle",""))); [print("VIDEO\t"+str(v.get("publishedAt",""))+"\t"+str(v.get("contentType",""))+"\t"+str(v.get("title",""))) for v in s.get("videos",[])]'
