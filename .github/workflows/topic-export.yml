name: Topic Export
on:
  push:
    paths:
      - '.github/workflows/topic-export.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ambiguous published video topics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check yt-dlp
          for id in Fzb1g4rJVRM uqj_HshxZbY R9-cO92laoM WDU0XGIzooE o9Btsg6VwDs RLDchBVZBZw DvwKqq-KuT0 jKH3w8LH4ww Kw1zScii4Gc f7lo1VbpDvQ 0UG0uM-3BN8 WO9oobAtMqE; do
            echo "=== $id ==="
            yt-dlp --ignore-errors --skip-download --print 'TITLE: %(title)s\nDESCRIPTION: %(description)s\n' "https://www.youtube.com/watch?v=$id"
          done
