name: Topic Export
on:
  push:
    paths:
      - '.github/workflows/topic-export.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export exact public channel titles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check yt-dlp
          echo '=== SHORTS ==='
          yt-dlp --ignore-errors --flat-playlist --print 'VIDEO\t%(id)s\t%(title)s' 'https://www.youtube.com/@tarihinizi-osmanli/shorts'
          echo '=== VIDEOS ==='
          yt-dlp --ignore-errors --flat-playlist --print 'VIDEO\t%(id)s\t%(title)s' 'https://www.youtube.com/@tarihinizi-osmanli/videos'
