name: Patch live dashboard event

on:
  push:
    paths:
      - "automation/live-event-patch.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add live dashboard listener
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/page.tsx")
          text = path.read_text()
          anchor = '''  }, []);\n\n  async function runAction(name: string, endpoint: string, options?: RequestInit) {'''
          replacement = '''  }, []);\n\n  useEffect(() => {\n    const handleLiveDashboard = (event: Event) => {\n      const dashboard = (event as CustomEvent<DashboardData>).detail;\n      if (dashboard) setData(dashboard);\n    };\n    window.addEventListener("youtube-dashboard-update", handleLiveDashboard);\n    return () => window.removeEventListener("youtube-dashboard-update", handleLiveDashboard);\n  }, []);\n\n  async function runAction(name: string, endpoint: string, options?: RequestInit) {'''
          if anchor not in text:
              raise SystemExit("Canlı veri dinleyicisi için beklenen nokta bulunamadı")
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
      - name: Commit live listener
        run: |
          git config user.name "youtube-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Paneli 2 dakikalık canlı veri olayına bağla"
          git push
